<fieldset>
  <legend>Good for</legend>
  <div class="options">
    @for (option of options; track option.value) {
      <button
        type="button"
        [attr.aria-pressed]="timeInForce().value === option.value"
        (click)="timeInForce().setValue(option.value)"
      >
        <strong>{{ option.label }}</strong
        ><span>{{ option.hint }}</span>
      </button>
    }
  </div>
  @if (timeInForce().value === 'GTD') {
    <label for="trade-expires">Expires at the market close on</label>
    <input
      id="trade-expires"
      type="date"
      [formControl]="expiresOn()"
      [min]="min()"
      [max]="max()"
      [attr.aria-invalid]="showDateError()"
      aria-describedby="expires-error"
    />
    <p id="expires-error" class="error" aria-live="polite">
      @if (showDateError()) {
        Pick a date from tomorrow up to 90 days ahead.
      }
    </p>
  }
</fieldset>
