<header class="nav-bar" [class.compact-trade]="compactTrade()">
  <a class="brand" routerLink="/dashboard">TechNova</a>

  <nav class="tabs" aria-label="Main">
    @for (tab of tabs; track tab.path) {
      <a class="tab" [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ tab.label }}</a>
    }
  </nav>

  <div class="account-cluster">
    @if (accountId(); as id) {
      <div class="account-switcher">
        <button
          type="button"
          class="account"
          [attr.aria-label]="'Switch account, current account ' + id"
          [attr.aria-expanded]="accountMenuOpen()"
          aria-controls="account-menu"
          (click)="toggleAccountMenu()"
        >
          {{ id }}
          <svg
            width="12"
            height="12"
            viewBox="0 0 12 12"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M2.5 4.5 6 8l3.5-3.5" />
          </svg>
        </button>

        @if (accountMenuOpen()) {
          <ul class="account-menu" id="account-menu">
            @for (account of accounts(); track account.accountId) {
              <li>
                <button
                  type="button"
                  class="account-option"
                  [attr.aria-current]="account.accountId === id ? 'true' : null"
                  (click)="selectAccount(account.accountId)"
                >
                  {{ account.accountId }}
                </button>
              </li>
            }
          </ul>
        }
      </div>
    }

    @if (username(); as name) {
      <div class="user">
        <button
          type="button"
          class="menu-button"
          [attr.aria-label]="'Account menu for ' + name"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="user-menu"
          (click)="toggleMenu()"
        >
          <span class="avatar" aria-hidden="true">{{ initial() }}</span>
          <span class="username">{{ name }}</span>
        </button>

        @if (menuOpen()) {
          <div class="menu" id="user-menu">
            <a class="menu-change-account" routerLink="/accounts" (click)="closeMenus()">Accounts</a>
            <a class="menu-change-account menu-risk-limits" routerLink="/risk-limits" (click)="closeMenus()"
              >Risk limits</a
            >
            <button type="button" class="menu-sign-out" (click)="signOut()">Sign out</button>
          </div>
        }
      </div>
    }

    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="theme.isDark()"
      [title]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleTheme()"
    >
      @if (theme.isDark()) {
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15.5A9 9 0 1 1 8.5 3 9 9 0 0 0 21 15.5Z" />
        </svg>
      }
    </button>
  </div>
</header>
