<svg viewBox="0 0 100 100" [attr.width]="size()" [attr.height]="size()" role="img" [attr.aria-label]="ariaLabel()">
  @if (arcs().length) {
    @for (arc of arcs(); track $index) {
      <circle
        class="arc"
        [class.cash]="arc.label === 'Cash'"
        cx="50"
        cy="50"
        r="40"
        pathLength="100"
        [attr.stroke-dasharray]="arc.dasharray"
        [attr.stroke-dashoffset]="arc.dashoffset"
        [style.stroke]="arc.color"
      />
    }
  } @else {
    <circle class="empty" cx="50" cy="50" r="40" />
  }
</svg>
