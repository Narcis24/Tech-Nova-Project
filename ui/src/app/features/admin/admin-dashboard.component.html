<h1>Admin</h1>
@if (username(); as name) {
  <p class="subtitle">Signed in as {{ name }}</p>
}

<a class="manage-link" routerLink="/admin/users">Manage users →</a>

@if (error()) {
  <div class="load-error" role="alert">
    <p>Couldn't load the users.</p>
    <button type="button" class="retry" (click)="load()">Try again</button>
  </div>
} @else if (users() === null) {
  <p class="loading">Loading users…</p>
} @else {
  <ul class="stats" aria-label="Users at a glance">
    @for (stat of stats(); track stat.label) {
      <li class="stat">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </li>
    }
  </ul>
}

<!-- Outside the users block, so it loads and fails on its own. Each widget reads the AnalyticsStore. -->
<section class="analytics panel" aria-labelledby="analytics-heading">
  <app-analytics-filters />
  <app-analytics-overview />
</section>
