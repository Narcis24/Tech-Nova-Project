<h1>Admin</h1>
@if (username(); as name) {
  <p class="subtitle">Signed in as {{ name }}</p>
}

<a class="manage-link" routerLink="/admin/users">Manage users →</a>

@if (error()) {
  <div class="load-error" role="alert">
    <p>Couldn't load the users.</p>
    <button type="button" class="retry" (click)="load()">Try again</button>
  </div>
} @else if (users() === null) {
  <p class="loading">Loading users…</p>
} @else {
  <ul class="stats" aria-label="Users at a glance">
    @for (stat of stats(); track stat.label) {
      <li class="stat">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </li>
    }
  </ul>
}

<!--
  Outside the users block, so it loads and fails on its own. Each widget is its own card, reads the
  AnalyticsStore, and is placed by the grid in the CSS; the size button switches between its two layouts.
-->
<div class="analytics" [class.chart-narrow]="!chartFullWidth()">
  <app-analytics-filters class="panel" role="region" aria-labelledby="analytics-heading">
    <button
      type="button"
      class="size"
      [attr.aria-pressed]="chartFullWidth()"
      [attr.aria-label]="
        chartFullWidth()
          ? 'Make the chart smaller, with Live beside it'
          : 'Make the chart full width, with Live below it'
      "
      [title]="chartFullWidth() ? 'Make the chart smaller' : 'Make the chart full width'"
      (click)="toggleChartWidth()"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        @if (chartFullWidth()) {
          <!-- Arrows pointing in: make it smaller -->
          <path d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4" />
        } @else {
          <!-- Arrows pointing out: make it bigger -->
          <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" />
        }
      </svg>
    </button>
  </app-analytics-filters>
  <app-analytics-overview class="panel main" role="region" aria-label="Trading activity chart" />
  <app-live-panel class="panel live" role="region" aria-labelledby="live-heading" />
  <app-top-traded-instruments class="panel half" role="region" aria-labelledby="top-traded-heading" />
  <app-asset-mix class="panel half" role="region" aria-labelledby="asset-mix-heading" />
</div>
