<div class="page">
  <button
    type="button"
    class="auth-theme-toggle"
    [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.aria-pressed]="theme.isDark()"
    [title]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="theme.toggle()"
  >
    @if (theme.isDark()) {
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15.5A9 9 0 0 1 8.5 3 9 9 0 1 0 21 15.5Z" />
      </svg>
    }
  </button>
  <section class="brand">
    <p class="wordmark">TechNova</p>
    <p class="tagline">Every market, one account.</p>
  </section>

  <main class="content">
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account.</p>

      @if (error()) {
        <div class="alert" role="alert">
          <span>{{ error() }}</span>
          <button type="button" class="alert-close" aria-label="Dismiss" (click)="dismissError()">×</button>
        </div>
      }

      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" required />
      @if (showRequired('username')) {
        <p class="field-error">Username is required</p>
      }

      <label for="password">Password</label>
      <div class="password">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          required
        />
        <button type="button" class="show" (click)="togglePassword()">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (showRequired('password')) {
        <p class="field-error">Password is required</p>
      }
      <a class="forgot" routerLink="/forgot-password">Forgot password?</a>

      <button type="submit" class="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
          <span class="visually-hidden">Signing in</span>
        } @else {
          Sign in
        }
      </button>

      <p class="signup">New to TechNova? <a routerLink="/register">Create an account</a></p>
    </form>
  </main>
</div>
