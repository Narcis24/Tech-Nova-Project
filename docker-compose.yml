services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      # runs any .sql files here once, on first container start, in filename order
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technova} -d ${POSTGRES_DB:-technova}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tech-nova-network

  # Single-node Kafka in KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    container_name: tech-nova-kafka
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    networks:
      - tech-nova-network

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-technova}
      DB_USER: ${POSTGRES_USER:-technova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - tech-nova-network

  auth-service:
    build: ./auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${AUTH_PORT:-8082}:8080"
    networks:
      - tech-nova-network

  execution-engine:
    build: ./execution-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENGINE_MIN_DELAY: ${ENGINE_MIN_DELAY:-500ms}
      ENGINE_MAX_DELAY: ${ENGINE_MAX_DELAY:-2000ms}
      ENGINE_MAX_PRICE_IMPROVEMENT_BPS: ${ENGINE_MAX_PRICE_IMPROVEMENT_BPS:-50}
    ports:
      - "${ENGINE_PORT:-8083}:8082"
    networks:
      - tech-nova-network

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: tech-nova-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: tech-nova
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    restart: unless-stopped
    networks:
      - tech-nova-network

  # not started by `up`; run with: docker-compose --profile pipeline run --rm pipeline
  pipeline:
    build: ./data-pipeline
    profiles: [pipeline]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-technova}
    networks:
      - tech-nova-network

  # not started by `up`; run with: docker-compose --profile quality up -d sonarqube
  sonarqube:
    image: sonarqube:community
    profiles: [quality]
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    networks:
      - tech-nova-network

volumes:
  db_data:
  sonar_data:
  sonar_extensions:

networks:
  tech-nova-network:
    driver: bridge
