services:
  ui:
    build: ./ui
    restart: unless-stopped
    # Memory caps keep one service from starving the VM; a service over its cap is restarted
    mem_limit: 64m
    depends_on: [app, auth-service]
    ports:
      - "${UI_PORT:-8091}:8080"
    networks:
      - tech-nova-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read once, when the volume is first created (V014); empty means no test admin
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-}

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-technova} -d ${POSTGRES_DB:-technova}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - tech-nova-network


  # =========================================================
  # Main Application
  # =========================================================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    mem_limit: 768m

    depends_on:
      db:
        condition: service_healthy

      kafka:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-technova}
      DB_USER: ${POSTGRES_USER:-technova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # Invite emails for users an admin creates go through auth-service
      AUTH_URL: http://auth-service:8082

      # Admin journal page: the engine's internal journal API and the secret both sides share
      ENGINE_URL: http://execution-engine:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Size the heap from mem_limit, as the execution engine's Dockerfile does
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0

    ports:
      - "${APP_PORT:-8081}:8081"

    networks:
      - tech-nova-network

  execution-engine:
    build:
      context: .
      dockerfile: execution-engine/Dockerfile
    restart: unless-stopped
    mem_limit: 512m

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      # Decision journal, one file per day; on a volume so it survives restarts
      EXECUTION_ENGINE_JOURNAL_DIR: /data/journal
      # Only the app, with this secret, may read journals through /internal/**
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}

    volumes:
      - engine_journal:/data/journal

    networks:
      - tech-nova-network

  auth-service:
    build: ./auth
    restart: unless-stopped
    mem_limit: 256m

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-technova}
      DB_USER: ${POSTGRES_USER:-technova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Password reset emails go to Mailpit, which catches them (inbox at http://localhost:8025)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: TechNova <no-reply@technova.local>
      # The page the reset email links to: the ui container by default; set RESET_URL in .env when using ng serve
      RESET_URL: ${RESET_URL:-http://localhost:${UI_PORT:-8091}/reset-password}

    ports:
      - "${AUTH_PORT:-8082}:8082"

    networks:
      - tech-nova-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped
    mem_limit: 768m

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # NewTopic beans in app create the required topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Kafka sets its own heap (1 GB by default); keep it well inside mem_limit
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m

    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "kafka:29092"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

    networks:
      - tech-nova-network

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: tech-nova-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: tech-nova
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    ports:
      - ${KAFKA_UI_PORT:-8085}:8080
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - tech-nova-network

  # Fake mail server for development: catches every email the services send and shows it
  # in a web inbox instead of delivering it
  mailpit:
    image: axllent/mailpit:v1.31.3

    profiles:
      - mail

    ports:
      - ${MAILPIT_PORT:-8025}:8025
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - tech-nova-network

  pipeline:
    build: ./data-pipeline
    mem_limit: 512m

    profiles:
      - pipeline

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: postgresql://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-technova}

    networks:
      - tech-nova-network


  sonarqube:
    image: sonarqube:26.9.0.129388-community
    # Three JVMs inside (web, compute engine, Elasticsearch); it does not start with much less
    mem_limit: 2560m

    profiles:
      - quality

    environment:
      SONAR_WEB_PORT: 8083

    ports:
      - "${SONAR_PORT:-8083}:8083"

    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions

    networks:
      - tech-nova-network


volumes:
  db_data:
  engine_journal:
  sonar_data:
  sonar_extensions:


networks:
  tech-nova-network:
    driver: bridge