services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      # runs any .sql files here once, on first container start, in filename order
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technova} -d ${POSTGRES_DB:-technova}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tech-nova-network

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-technova}
      DB_USER: ${POSTGRES_USER:-technova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - tech-nova-network

  auth-service:
    build: ./auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
    ports:
      - "${AUTH_PORT:-8082}:8080"
    networks:
      - tech-nova-network

  # not started by `up`; run with: docker-compose --profile pipeline run --rm pipeline
  pipeline:
    build: ./data-pipeline
    profiles: [pipeline]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-technova}
    networks:
      - tech-nova-network

  # not started by `up`; run with: docker-compose --profile quality up -d sonarqube
  sonarqube:
    image: sonarqube:community
    profiles: [quality]
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    networks:
      - tech-nova-network

volumes:
  db_data:
  sonar_data:
  sonar_extensions:

networks:
  tech-nova-network:
    driver: bridge
