services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-technova} -d ${POSTGRES_DB:-technova}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tech-nova-network

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-technova}
      DB_USER: ${POSTGRES_USER:-technova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}

      # Kafka is another container on the same Docker network.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - tech-nova-network

  execution-engine:
    build: ./executionEngine
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tech-nova-network


  auth-service:
    build: ./auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
    ports:
      - "${AUTH_PORT:-8082}:8080"
    networks:
      - tech-nova-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 29092 = communication between Docker containers
      # 9092  = communication from host machine
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    ports:
      - "9092:9092"

    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "kafka:29092"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

    networks:
      - tech-nova-network


  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro

    entrypoint:
      - /bin/bash
      - /create-topics.sh

    networks:
      - tech-nova-network

  pipeline:
    build: ./data-pipeline
    profiles:
      - pipeline

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: postgresql://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-technova}

    networks:
      - tech-nova-network

  sonarqube:
    image: sonarqube:community
    profiles:
      - quality

    ports:
      - "${SONAR_PORT:-9000}:9000"

    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions

    networks:
      - tech-nova-network


volumes:
  db_data:
  sonar_data:
  sonar_extensions:


networks:
  tech-nova-network:
    driver: bridge