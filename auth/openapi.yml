openapi: 3.0.0
info:
  title: Tech Nova Auth Service API
  version: 1.0.0
  description: Authentication service for issuing and validating JWT tokens

servers:
  - url: http://localhost:8082/auth
    description: Local development server

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 8
          maxLength: 16
          example: "john_doe"
        password:
          type: string
          minLength: 12
          maxLength: 20
          example: "Something123@"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        username:
          type: string
          example: "john_doe"

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 8
          maxLength: 16
          example: "john_doe"
        password:
          type: string
          minLength: 12
          maxLength: 20
          example: "Something123@"

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "AUTH_ERROR"
        message:
          type: string
          example: "User not found"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /v1/auth/register:
    post:
      summary: Register a new user
      description: Create a new user account for authentication
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  username:
                    type: string
        '400':
          description: 'Validation failed (invalid input)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Username already exists (USERNAME_ALREADY_EXIST)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      summary: Login user and get JWT token
      description: Authenticate user credentials and return JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Invalid credentials (INVALID_CREDENTIALS)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
