spring.application.name=auth-service
server.port=8080
server.servlet.context-path=/auth

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:technova}
spring.datasource.username=${DB_USER:technova}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Required, no default: startup fails if JWT_SECRET is unset or shorter than 32 bytes
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
