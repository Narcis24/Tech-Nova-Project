# Application Configuration
server.port=8081
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:technova}
spring.datasource.username=${DB_USER:technova}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Limit order matcher: how often (ms) pending limit orders are checked against the latest price
orders.matcher.interval-ms=30000
# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production}
