spring:
  application:
    name: execution-engine

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      acks: all

      # We manually convert EventEnvelope -> JSON String
      # inside EventProducerService.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      properties:
        enable.idempotence: true

    consumer:
      group-id: execution-engine
      auto-offset-reset: earliest

      # ExecutionEngine receives JSON from Kafka as a String,
      # then ObjectMapper converts it to EventEnvelope.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false


server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include: health,info


# Keep in sync with the instruments table (db/migrations/V003_seed_data.sql).
# 39 symbols -> 2 batches of up to 25; every 120s = 720 cycles/day -> 1,440 requests/day (quota 2,000)
market-data:
  interval-seconds: ${MARKET_DATA_INTERVAL_SECONDS:120}
  daily-quota: 2000
  max-quote-age-seconds: 600
  key-id: ${ALPACA_KEY_ID:}
  secret-key: ${ALPACA_SECRET_KEY:}
  symbols: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AVGO,BRK-B,JPM,LLY,V,XOM,UNH,MA,JNJ,PG,HD,COST,ABBV,WMT,KO,PEP,BAC,CVX,SPY,QQQ,IWM,DIA,VTI,EFA,XLK,XLE,TLT,IEF,AGG,LQD,GLD,SLV
